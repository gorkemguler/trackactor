services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TRACKACTOR_DB_URL: sqlite:////data/trackactor.db
      # To run on Postgres instead, start with `--profile postgres` and use:
      # TRACKACTOR_DB_URL: postgresql+psycopg://trackactor:trackactor@db:5432/trackactor
    volumes:
      - trackactor-data:/data
    expose:
      - "8000"
    # uncomment to hit the API directly from the host
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3

  db:
    image: postgres:16
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackactor
      POSTGRES_PASSWORD: trackactor
      POSTGRES_DB: trackactor
    volumes:
      - trackactor-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trackactor"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  trackactor-data:
  trackactor-pg:
