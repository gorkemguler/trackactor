services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TRACKACTOR_DB_URL: sqlite:////data/trackactor.db
    volumes:
      - trackactor-data:/data
    expose:
      - "8000"
    # uncomment to hit the API directly from the host
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  trackactor-data:
