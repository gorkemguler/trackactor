name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: trackactor
          POSTGRES_DB: trackactor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TRACKACTOR_DB_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://postgres:trackactor@localhost:5432/trackactor' || 'sqlite:////tmp/ci.db' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Migrations apply from scratch
        run: python -m alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node node_modules/esbuild/install.js
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trackactor-backend ./backend
      - run: docker build -t trackactor-web ./frontend
      - name: Backend container starts and answers /api/health
        run: |
          docker run -d --name be -p 8000:8000 trackactor-backend
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/api/health
          docker rm -f be
